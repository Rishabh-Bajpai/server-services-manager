<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor - Server Services Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">
    <div class="max-w-7xl mx-auto p-6">
        <!-- Header -->
        <header class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-emerald-600 rounded-lg text-white">
                    <i data-lucide="activity" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">System Monitor</h1>
                    <p class="text-gray-400 text-sm">Real-time host metrics</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="connection-badge" class="px-3 py-1 rounded-full text-xs font-medium bg-green-500/10 text-green-500">Connected</span>
                <a href="/" class="flex items-center gap-2 px-4 py-2 bg-gray-700 text-white rounded-md hover:bg-gray-600 transition-colors text-sm font-medium">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    Dashboard
                </a>
                <a href="/logout" class="flex items-center gap-2 px-4 py-2 bg-red-600/10 text-red-500 border border-red-600/20 rounded-md hover:bg-red-600/20 transition-colors text-sm font-medium">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Logout
                </a>
            </div>
        </header>

        <!-- Top Row: System Info + CPU -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
            <!-- System Info -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <div class="flex items-center gap-2 text-gray-400 mb-3">
                    <i data-lucide="info" class="w-4 h-4"></i>
                    <span class="text-sm font-medium uppercase tracking-wider">System</span>
                </div>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-500">Hostname</span>
                        <span class="font-mono" id="sys-hostname">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">Kernel</span>
                        <span class="font-mono" id="sys-kernel">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">Uptime</span>
                        <span class="font-mono" id="sys-uptime">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">Load Average</span>
                        <span class="font-mono" id="sys-load">--</span>
                    </div>
                </div>
            </div>

            <!-- CPU -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5 lg:col-span-2">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="cpu" class="w-4 h-4"></i>
                        <span class="text-sm font-medium uppercase tracking-wider">CPU</span>
                    </div>
                    <span class="text-2xl font-bold font-mono" id="cpu-total">--%</span>
                </div>
                <div class="h-2 bg-gray-800 rounded-full mb-3 overflow-hidden">
                    <div id="cpu-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width:0%"></div>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2" id="cpu-cores"></div>
            </div>
        </div>

        <!-- Memory -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="memory-stick" class="w-4 h-4"></i>
                        <span class="text-sm font-medium uppercase tracking-wider">Memory</span>
                    </div>
                    <span class="text-sm font-mono" id="mem-text">--</span>
                </div>
                <div class="h-3 bg-gray-800 rounded-full mb-1 overflow-hidden">
                    <div id="mem-bar" class="h-full bg-blue-500 rounded-full transition-all duration-500" style="width:0%"></div>
                </div>
                <div class="flex justify-between text-xs text-gray-500">
                    <span>Used: <span class="font-mono" id="mem-used">--</span></span>
                    <span>Available: <span class="font-mono" id="mem-avail">--</span></span>
                    <span>Total: <span class="font-mono" id="mem-total">--</span></span>
                </div>
            </div>
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="hard-drive" class="w-4 h-4"></i>
                        <span class="text-sm font-medium uppercase tracking-wider">Swap</span>
                    </div>
                    <span class="text-sm font-mono" id="swap-text">--</span>
                </div>
                <div class="h-3 bg-gray-800 rounded-full mb-1 overflow-hidden">
                    <div id="swap-bar" class="h-full bg-purple-500 rounded-full transition-all duration-500" style="width:0%"></div>
                </div>
                <div class="flex justify-between text-xs text-gray-500">
                    <span>Used: <span class="font-mono" id="swap-used">--</span></span>
                    <span>Total: <span class="font-mono" id="swap-total">--</span></span>
                </div>
            </div>
        </div>

        <!-- Disks -->
        <div class="bg-gray-900 rounded-xl border border-gray-800 p-5 mb-4">
            <div class="flex items-center gap-2 text-gray-400 mb-4">
                <i data-lucide="hard-drive" class="w-4 h-4"></i>
                <span class="text-sm font-medium uppercase tracking-wider">Disks</span>
                <span class="ml-auto text-xs text-gray-600 flex items-center gap-3">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Read</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-500 inline-block"></span> Write</span>
                    <span id="disk-io-speed">--</span>
                </span>
            </div>
            <div class="space-y-3" id="disks-container"></div>
        </div>

        <!-- Network + Processes -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <!-- Network -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <div class="flex items-center gap-2 text-gray-400 mb-3">
                    <i data-lucide="wifi" class="w-4 h-4"></i>
                    <span class="text-sm font-medium uppercase tracking-wider">Network</span>
                </div>
                <div id="net-container" class="space-y-3"></div>
            </div>

            <!-- Processes -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <div class="flex items-center gap-2 text-gray-400 mb-3">
                    <i data-lucide="list" class="w-4 h-4"></i>
                    <span class="text-sm font-medium uppercase tracking-wider">Top Processes</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-gray-500 text-xs uppercase">
                            <tr>
                                <th class="pb-2">PID</th>
                                <th class="pb-2">Name</th>
                                <th class="pb-2 text-right">CPU</th>
                                <th class="pb-2 text-right">MEM</th>
                                <th class="pb-2">State</th>
                            </tr>
                        </thead>
                        <tbody id="procs-body" class="divide-y divide-gray-800 font-mono"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const socket = io({ transports: ['websocket'], upgrade: false });
        const badge = document.getElementById('connection-badge');

        socket.on('connect', () => {
            badge.textContent = 'Connected';
            badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-green-500/10 text-green-500';
        });
        socket.on('disconnect', () => {
            badge.textContent = 'Disconnected';
            badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-500';
        });

        function fmtBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const s = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + s[i];
        }

        function fmtSpeed(bytesPerSec) {
            return fmtBytes(bytesPerSec) + '/s';
        }

        function fmtUptime(seconds) {
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            let parts = [];
            if (d > 0) parts.push(d + 'd');
            if (h > 0 || d > 0) parts.push(h + 'h');
            parts.push(m + 'm');
            return parts.join(' ');
        }

        socket.on('system_stats', (s) => {
            // System Info
            document.getElementById('sys-hostname').textContent = s.system.hostname;
            document.getElementById('sys-kernel').textContent = s.system.kernel;
            document.getElementById('sys-uptime').textContent = fmtUptime(s.system.uptime);
            document.getElementById('sys-load').textContent = s.cpu.load.map(l => l.toFixed(1)).join(' / ');

            // CPU
            const cpuPct = s.cpu.percent;
            document.getElementById('cpu-total').textContent = cpuPct.toFixed(1) + '%';
            document.getElementById('cpu-bar').style.width = cpuPct + '%';
            if (cpuPct > 80) document.getElementById('cpu-bar').className = 'h-full bg-red-500 rounded-full transition-all duration-500';
            else if (cpuPct > 50) document.getElementById('cpu-bar').className = 'h-full bg-yellow-500 rounded-full transition-all duration-500';
            else document.getElementById('cpu-bar').className = 'h-full bg-emerald-500 rounded-full transition-all duration-500';

            // Per-core
            const coresDiv = document.getElementById('cpu-cores');
            let coresHtml = '';
            s.cpu.cores.forEach((c, i) => {
                const color = c > 80 ? 'bg-red-500' : c > 50 ? 'bg-yellow-500' : 'bg-emerald-500';
                coresHtml += `<div class="bg-gray-800 rounded p-2">
                    <div class="text-xs text-gray-400 mb-1">Core ${i}</div>
                    <div class="text-lg font-bold font-mono">${c.toFixed(0)}%</div>
                    <div class="h-1 bg-gray-700 rounded-full mt-1 overflow-hidden">
                        <div class="h-full ${color} rounded-full transition-all duration-500" style="width:${c}%"></div>
                    </div>
                </div>`;
            });
            coresDiv.innerHTML = coresHtml;

            // Memory
            const mem = s.memory;
            document.getElementById('mem-text').textContent = mem.percent.toFixed(1) + '%';
            document.getElementById('mem-bar').style.width = mem.percent + '%';
            document.getElementById('mem-used').textContent = fmtBytes(mem.used);
            document.getElementById('mem-avail').textContent = fmtBytes(mem.available);
            document.getElementById('mem-total').textContent = fmtBytes(mem.total);

            // Swap
            document.getElementById('swap-text').textContent = mem.swap_percent.toFixed(1) + '%';
            document.getElementById('swap-bar').style.width = mem.swap_percent + '%';
            document.getElementById('swap-used').textContent = fmtBytes(mem.swap_used);
            document.getElementById('swap-total').textContent = fmtBytes(mem.swap_total);

            // Disks
            const diskContainer = document.getElementById('disks-container');
            diskContainer.innerHTML = s.disks.map(d => `<div class="flex items-center gap-3">
                <div class="w-32 text-xs text-gray-400 truncate" title="${d.device}">${d.mount}</div>
                <div class="flex-1 h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div class="h-full ${d.percent > 85 ? 'bg-red-500' : 'bg-emerald-500'} rounded-full transition-all duration-500" style="width:${d.percent}%"></div>
                </div>
                <div class="w-24 text-xs text-gray-500 text-right font-mono">${fmtBytes(d.used)} / ${fmtBytes(d.total)}</div>
                <div class="w-12 text-xs text-right font-mono ${d.percent > 85 ? 'text-red-400' : 'text-gray-400'}">${d.percent}%</div>
            </div>`).join('');

            // Disk IO
            document.getElementById('disk-io-speed').textContent =
                'R ' + fmtSpeed(s.disk_io.read_speed) + '  W ' + fmtSpeed(s.disk_io.write_speed);

            // Network
            const netDiv = document.getElementById('net-container');
            netDiv.innerHTML = s.network.map(n => `<div class="bg-gray-800/50 rounded-lg p-3">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-sm font-medium">${n.interface}</span>
                </div>
                <div class="flex justify-between text-xs">
                    <span class="text-emerald-400">&#8595; ${fmtSpeed(n.recv_speed)}</span>
                    <span class="text-orange-400">&#8593; ${fmtSpeed(n.sent_speed)}</span>
                </div>
            </div>`).join('');

            // Processes
            const tbody = document.getElementById('procs-body');
            tbody.innerHTML = s.processes.map(p => `<tr class="hover:bg-gray-800/50">
                <td class="py-1 text-gray-500">${p.pid}</td>
                <td class="py-1 truncate max-w-[120px]">${p.name}</td>
                <td class="py-1 text-right ${p.cpu > 20 ? 'text-red-400' : 'text-gray-300'}">${p.cpu}%</td>
                <td class="py-1 text-right text-gray-400">${p.memory}%</td>
                <td class="py-1 text-xs"><span class="px-1.5 py-0.5 rounded ${p.status === 'running' ? 'bg-green-500/10 text-green-400' : 'bg-gray-500/10 text-gray-400'}">${p.status}</span></td>
            </tr>`).join('');
        });
    </script>
</body>
</html>
