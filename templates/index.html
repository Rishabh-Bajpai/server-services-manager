<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Services Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        /* Custom scrollbar for terminal */
        .terminal-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .terminal-scroll::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .terminal-scroll::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .terminal-scroll::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 h-screen font-sans overflow-hidden">
    <div id="app" class="flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="flex-none p-8 pb-4 flex items-center justify-between bg-gray-950 z-10">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-blue-600 rounded-lg text-white">
                    <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Server Services Manager</h1>
                    <p class="text-gray-400 text-sm">Control Center</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="openFileManager()"
                    class="flex items-center gap-2 px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors text-sm font-medium">
                    <i data-lucide="folder" class="w-4 h-4"></i>
                    Files
                </button>
                <button onclick="openModal()"
                    class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors text-sm font-medium">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Add Service
                </button>
                <a href="/logout"
                    class="flex items-center gap-2 px-4 py-2 bg-red-600/10 text-red-500 border border-red-600/20 rounded-md hover:bg-red-600/20 transition-colors text-sm font-medium">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Logout
                </a>
                <div id="connection-status"
                    class="px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-500">
                    Disconnected
                </div>
            </div>
        </header>

        <!-- Main Content (Split View) -->
        <div class="flex-1 flex flex-col min-h-0 relative">

            <!-- Services Pane (Top) -->
            <div id="services-pane" class="flex-1 overflow-y-auto min-h-[100px] p-8 pt-0">
                <main id="program-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    <!-- Programs will be injected here -->
                </main>
            </div>

            <!-- Resizer Handle -->
            <div id="resizer"
                class="h-2 bg-gray-900 border-y border-gray-800 cursor-row-resize hover:bg-blue-600/20 hover:border-blue-500/50 transition-colors flex items-center justify-center shrink-0 z-20">
                <div class="w-16 h-1 rounded-full bg-gray-700"></div>
            </div>

            <!-- Terminal Pane (Bottom) -->
            <div id="terminal-pane" class="h-[400px] min-h-[150px] bg-gray-950 flex flex-col p-8 pt-2">
                <section class="flex-1 bg-gray-900 rounded-xl border border-gray-800 overflow-hidden flex flex-col">
                    <div class="flex items-center justify-between bg-gray-900/50 border-b border-gray-800 p-2 shrink-0">
                        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar" id="terminal-tabs">
                            <!-- Tabs injected here -->
                        </div>
                        <button onclick="createNewTerminal()"
                            class="p-2 hover:bg-gray-800 rounded-md text-gray-400 hover:text-white transition-colors"
                            title="New Terminal">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div id="terminal-container" class="flex-1 bg-black relative">
                        <!-- Terminals injected here -->
                    </div>
                </section>
            </div>

        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-gray-900 text-gray-100 rounded-xl border border-gray-800 shadow-lg w-full max-w-md p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h2 id="modal-title" class="text-xl font-bold mb-4">Add New Service</h2>

            <form id="service-form" class="space-y-4">
                <input type="hidden" id="original-name">
                <div>
                    <label class="block text-sm font-medium mb-1">Name</label>
                    <input type="text" id="name" required
                        class="w-full bg-gray-800 rounded-md border border-gray-700 p-2 text-sm focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Command</label>
                    <input type="text" id="command" required placeholder="e.g. python main.py"
                        class="w-full bg-gray-800 rounded-md border border-gray-700 p-2 text-sm font-mono focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Working Directory</label>
                    <input type="text" id="cwd" required placeholder="/path/to/dir"
                        class="w-full bg-gray-800 rounded-md border border-gray-700 p-2 text-sm font-mono focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Environment Variables</label>
                    <textarea id="environment" placeholder="KEY=VALUE (one per line)"
                        class="w-full bg-gray-800 rounded-md border border-gray-700 p-2 text-sm font-mono h-24 focus:border-blue-500 focus:outline-none"></textarea>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="autostart" checked
                        class="rounded bg-gray-800 border-gray-700 text-blue-600 focus:ring-blue-500">
                    <label for="autostart" class="text-sm">Auto-start on launch</label>
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-md font-medium hover:bg-blue-700 transition-colors">
                    Save Service
                </button>
            </form>
        </div>
    </div>

    <!-- File Manager Modal -->
    <div id="file-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div
            class="bg-gray-900 text-gray-100 rounded-xl border border-gray-800 shadow-lg w-full max-w-4xl h-[80vh] flex flex-col relative">
            <button onclick="closeFileManager()" class="absolute top-4 right-4 text-gray-400 hover:text-white z-10">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="p-6 border-b border-gray-800 flex items-center justify-between">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="folder-open" class="w-6 h-6 text-blue-500"></i>
                    File Manager
                </h2>
                <div class="mr-8">
                    <span id="current-path" class="text-gray-400 font-mono text-sm">/</span>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="p-4 bg-gray-900/50 border-b border-gray-800 flex items-center gap-4">
                <button onclick="fetchFiles(currentPath + '/..')"
                    class="p-2 bg-gray-800 hover:bg-gray-700 rounded transition-colors text-gray-300" title="Go Up">
                    <i data-lucide="arrow-up" class="w-4 h-4"></i>
                </button>
                <button onclick="fetchFiles(currentPath)"
                    class="p-2 bg-gray-800 hover:bg-gray-700 rounded transition-colors text-gray-300" title="Refresh">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
                <div class="w-px h-8 bg-gray-800"></div>

                <input type="file" id="file-upload-input" class="hidden" onchange="handleFileUpload(this)">
                <label for="file-upload-input"
                    class="flex items-center gap-2 px-3 py-2 bg-blue-600 text-white rounded cursor-pointer hover:bg-blue-700 transition-colors text-sm font-medium">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    Upload File
                </label>
            </div>

            <!-- File List -->
            <div class="flex-1 overflow-y-auto p-4 bg-gray-950">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-900 text-gray-400 sticky top-0">
                        <tr>
                            <th class="p-3 font-medium">Name</th>
                            <th class="p-3 font-medium w-32">Size</th>
                            <th class="p-3 font-medium w-48">Modified</th>
                            <th class="p-3 font-medium w-24 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="file-list" class="divide-y divide-gray-800">
                        <!-- Files injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Resizing Logic
        const resizer = document.getElementById('resizer');
        const servicesPane = document.getElementById('services-pane');
        const terminalPane = document.getElementById('terminal-pane');
        const appContainer = document.querySelector('.flex-1.flex-col.min-h-0'); // The main container

        let isResizing = false;

        if (resizer) {
            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'row-resize';
                resizer.classList.add('bg-blue-600/20');
                e.preventDefault(); // Prevent text selection
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                // Calculate new height for terminal pane from bottom
                const containerRect = appContainer.getBoundingClientRect();
                const newTerminalHeight = containerRect.bottom - e.clientY;

                // Constraints
                const MIN_TERMINAL_HEIGHT = 150;
                const MAX_TERMINAL_HEIGHT = containerRect.height - 150; // Keep space for services

                if (newTerminalHeight >= MIN_TERMINAL_HEIGHT && newTerminalHeight <= MAX_TERMINAL_HEIGHT) {
                    terminalPane.style.height = `${newTerminalHeight}px`;
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    resizer.classList.remove('bg-blue-600/20');

                    // Trigger resize for terminals to refit
                    if (typeof activeTerminalId !== 'undefined' && activeTerminalId && terminals[activeTerminalId]) {
                        const session = terminals[activeTerminalId];
                        session.fitAddon.fit();
                        const dims = session.fitAddon.proposeDimensions();
                        if (dims) {
                            socket.emit('terminal_resize', { id: activeTerminalId, cols: dims.cols, rows: dims.rows });
                        }
                    }
                }
            });
        }
    </script>
    <script>
        const socket = io({
            transports: ['websocket'],
            upgrade: false
        });
        const grid = document.getElementById('program-grid');
        const connectionStatus = document.getElementById('connection-status');
        let programsState = {}; // Store local state like auto-scroll per program

        // Terminal State
        let terminals = {}; // { id: { term: Terminal, fitAddon: FitAddon, container: HTMLElement } }
        let activeTerminalId = null;
        let terminalCount = 0;

        // Icons initialization
        lucide.createIcons();

        socket.on('connect', () => {
            connectionStatus.textContent = 'System Online';
            connectionStatus.className = 'px-3 py-1 rounded-full text-xs font-medium bg-green-500/10 text-green-500';
        });

        socket.on('disconnect', () => {
            connectionStatus.textContent = 'Disconnected';
            connectionStatus.className = 'px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-500';
        });

        socket.on('update', (msg) => {
            renderPrograms(msg.data);
        });

        // Terminal Socket Events
        socket.on('terminal_output', (msg) => {
            const session = terminals[msg.id];
            if (session) {
                session.term.write(msg.data);
            }
        });

        socket.on('terminal_closed', (msg) => {
            removeTerminal(msg.id);
        });

        function renderPrograms(programs) {
            if (programs.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">No programs configured. Click "Add Service" to get started.</div>';
                return;
            }

            // Diffing logic could be better, but for now we re-render if needed or update content
            // To avoid losing scroll position/state, we try to update existing elements

            programs.forEach(p => {
                let card = document.getElementById(`card-${p.name}`);
                if (!card) {
                    card = createCard(p);
                    grid.appendChild(card);
                    // Initialize state
                    programsState[p.name] = { autoScroll: true, collapsed: false };
                } else {
                    updateCard(card, p);
                }
            });

            // Remove deleted
            const currentNames = programs.map(p => p.name);
            Array.from(grid.children).forEach(child => {
                const name = child.id.replace('card-', '');
                if (!currentNames.includes(name) && child.id.startsWith('card-')) {
                    child.remove();
                }
            });

            lucide.createIcons();
        }

        function getStatusColor(status) {
            switch (status) {
                case 'running': return 'text-green-500 bg-green-500/10 border-green-500/20';
                case 'stopped': return 'text-gray-500 bg-gray-500/10 border-gray-500/20';
                case 'starting': return 'text-blue-500 bg-blue-500/10 border-blue-500/20';
                case 'stopping': return 'text-yellow-500 bg-yellow-500/10 border-yellow-500/20';
                case 'failed': return 'text-red-500 bg-red-500/10 border-red-500/20';
                default: return 'text-gray-500';
            }
        }

        function createCard(p) {
            // Initialize state if new
            if (!programsState[p.name]) {
                programsState[p.name] = { autoScroll: true, collapsed: false };
            }

            const div = document.createElement('div');
            div.id = `card-${p.name}`;
            div.className = 'bg-gray-900 rounded-xl border border-gray-800 overflow-hidden flex flex-col transition-all duration-300';
            // Height is dynamic based on collapse
            div.style.height = programsState[p.name].collapsed ? 'auto' : '500px';

            div.innerHTML = `
                <div class="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-900/50">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleCollapse('${p.name}')" class="text-gray-400 hover:text-white transition-colors">
                            <i data-lucide="${programsState[p.name].collapsed ? 'chevron-right' : 'chevron-down'}" class="w-5 h-5 collapse-icon"></i>
                        </button>
                        <div class="status-indicator w-2 h-2 rounded-full bg-gray-500"></div>
                        <h3 class="font-semibold text-lg">${p.name}</h3>
                    </div>
                    <div class="status-badge px-2 py-1 rounded text-xs font-medium border uppercase tracking-wider">
                        ${p.status}
                    </div>
                </div>
                
                <div class="terminal-container flex-1 bg-black p-4 overflow-y-auto font-mono text-sm terminal-scroll ${programsState[p.name].collapsed ? 'hidden' : ''}">
                    <div class="logs text-green-400 whitespace-pre-wrap break-all"></div>
                </div>

                <div class="p-4 border-t border-gray-800 bg-gray-900/50 ${programsState[p.name].collapsed ? 'hidden' : ''}">
                    <div class="flex items-center justify-between">
                        <div class="text-xs text-gray-500">
                            Restarts: <span class="restart-count">${p.restart_count}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="toggleAutoScroll('${p.name}')" class="p-2 bg-gray-500/10 text-gray-400 rounded-md hover:bg-gray-500/20 transition-colors" title="Toggle Auto-scroll">
                                <i data-lucide="${programsState[p.name].autoScroll ? 'lock' : 'unlock'}" class="w-4 h-4 autoscroll-icon"></i>
                            </button>
                            <div class="w-px h-8 bg-gray-800 mx-1"></div>
                            <button onclick="control('${p.name}', 'start')" class="btn-start p-2 bg-green-500/10 text-green-500 rounded-md hover:bg-green-500/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" title="Start">
                                <i data-lucide="play" class="w-4 h-4"></i>
                            </button>
                            <button onclick="control('${p.name}', 'stop')" class="btn-stop p-2 bg-red-500/10 text-red-500 rounded-md hover:bg-red-500/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" title="Stop">
                                <i data-lucide="square" class="w-4 h-4"></i>
                            </button>
                            <button onclick="control('${p.name}', 'restart')" class="btn-restart p-2 bg-blue-500/10 text-blue-500 rounded-md hover:bg-blue-500/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" title="Restart">
                                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                            </button>
                            <div class="w-px h-8 bg-gray-800 mx-1"></div>
                            <button onclick="editService('${p.name}')" class="btn-edit p-2 bg-gray-500/10 text-gray-400 rounded-md hover:bg-gray-500/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" title="Edit">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteService('${p.name}')" class="btn-delete p-2 bg-red-500/10 text-red-500 rounded-md hover:bg-red-500/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" title="Delete">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        function updateCard(card, p) {
            // Update Status Badge
            const badge = card.querySelector('.status-badge');
            badge.className = `status-badge px-2 py-1 rounded text-xs font-medium border uppercase tracking-wider ${getStatusColor(p.status)}`;
            badge.textContent = p.status;

            // Update Status Indicator
            const indicator = card.querySelector('.status-indicator');
            indicator.className = `status-indicator w-2 h-2 rounded-full ${p.status === 'running' ? 'bg-green-500' : 'bg-gray-500'}`;

            // Update Restarts
            const restartCount = card.querySelector('.restart-count');
            if (restartCount) restartCount.textContent = p.restart_count;

            // State
            const state = programsState[p.name];

            // Update Collapse UI
            const collapseIcon = card.querySelector('.collapse-icon');
            if (collapseIcon) collapseIcon.setAttribute('data-lucide', state.collapsed ? 'chevron-right' : 'chevron-down');

            card.style.height = state.collapsed ? 'auto' : '500px';

            const terminal = card.querySelector('.terminal-container');
            const footer = card.querySelector('.p-4.border-t');

            if (state.collapsed) {
                terminal.classList.add('hidden');
                footer.classList.add('hidden');
            } else {
                terminal.classList.remove('hidden');
                footer.classList.remove('hidden');

                // Update Logs only if visible
                const logsContainer = card.querySelector('.logs');
                logsContainer.textContent = p.logs.join('\n');

                // Auto-scroll
                if (state.autoScroll) {
                    terminal.scrollTop = terminal.scrollHeight;
                }

                // Update Auto-scroll icon
                const lockIcon = card.querySelector('.autoscroll-icon');
                if (lockIcon) lockIcon.setAttribute('data-lucide', state.autoScroll ? 'lock' : 'unlock');
            }

            // Button Logic
            const btnStart = card.querySelector('.btn-start');
            const btnStop = card.querySelector('.btn-stop');
            const btnRestart = card.querySelector('.btn-restart');
            const btnEdit = card.querySelector('.btn-edit');
            const btnDelete = card.querySelector('.btn-delete');

            const isRunning = p.status === 'running' || p.status === 'starting';
            const isStopped = p.status === 'stopped' || p.status === 'failed';

            if (btnStart) btnStart.disabled = isRunning;
            if (btnStop) btnStop.disabled = isStopped;
            if (btnRestart) btnRestart.disabled = isStopped; // As requested
            if (btnEdit) btnEdit.disabled = !isStopped;
            if (btnDelete) btnDelete.disabled = !isStopped;
        }

        function toggleCollapse(name) {
            if (programsState[name]) {
                programsState[name].collapsed = !programsState[name].collapsed;
                // Trigger re-render or just update class? 
                // Since we rely on updateCard for state, we can wait for next update or force one.
                // Let's force update by finding card and calling updateCard with current data?
                // We don't have current data easily. 
                // But updateCard is called every second. 
                // For immediate feedback, let's manually toggle classes.
                const card = document.getElementById(`card-${name}`);
                if (card) {
                    // We need the program object to call updateCard properly, or we just hack it.
                    // Better to wait for next tick? 1s is long.
                    // Let's just toggle classes manually here to match updateCard logic.
                    const state = programsState[name];
                    const collapseIcon = card.querySelector('.collapse-icon');
                    const terminalWrapper = card.querySelector('.terminal-wrapper');
                    const terminal = card.querySelector('.terminal-container');
                    const footer = card.querySelector('.p-4.border-t');

                    card.style.height = state.collapsed ? 'auto' : '500px';
                    if (collapseIcon) {
                        collapseIcon.setAttribute('data-lucide', state.collapsed ? 'chevron-right' : 'chevron-down');
                        lucide.createIcons();
                    }

                    if (state.collapsed) {
                        if (terminalWrapper) terminalWrapper.classList.add('hidden');
                        footer.classList.add('hidden');
                    } else {
                        if (terminalWrapper) terminalWrapper.classList.remove('hidden');
                        footer.classList.remove('hidden');
                        // Scroll to bottom if auto-scroll
                        if (state.autoScroll) terminal.scrollTop = terminal.scrollHeight;
                    }
                }
            }
        }

        function toggleAutoScroll(name) {
            if (programsState[name]) {
                programsState[name].autoScroll = !programsState[name].autoScroll;
                // Immediate feedback
                const card = document.getElementById(`card-${name}`);
                const lockIcon = card.querySelector('.autoscroll-icon');
                if (lockIcon) {
                    lockIcon.setAttribute('data-lucide', programsState[name].autoScroll ? 'lock' : 'unlock');
                    lucide.createIcons();
                }
            }
        }

        async function deleteService(name) {
            if (!confirm(`Are you sure you want to delete service "${name}"?`)) return;

            try {
                const res = await fetch(`/programs/${name}`, { method: 'DELETE' });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.error || 'Failed to delete');
                }
                // UI update will happen via websocket
            } catch (err) {
                alert(err.message);
            }
        }

        async function control(name, action) {
            await fetch(`/programs/${name}/${action}`, { method: 'POST' });
        }

        // Modal Logic
        const modal = document.getElementById('modal');
        const form = document.getElementById('service-form');
        let isEditing = false;

        function openModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('modal-title').textContent = 'Add New Service';
            form.reset();
            document.getElementById('name').disabled = false;
            document.getElementById('original-name').value = '';
            isEditing = false;
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function editService(name) {
            // Fetch current config? Or assume we have it? 
            // We don't have full config in websocket update (only logs/status).
            // We need to fetch it or store it. 
            // Let's fetch from server or just use what we know?
            // Actually, the websocket update doesn't have command/cwd.
            // We should add an endpoint to get program details or include it in WS (heavy).
            // Let's just add a GET /programs endpoint that returns full config?
            // Or just fetch all programs once on load?

            // For now, let's just fetch all programs to find this one.
            const res = await fetch('/programs');
            const data = await res.json();
            // Wait, the GET /programs in app.py returns status/restart_count too, but maybe not config details?
            // Let's check app.py... it returns name, status... 
            // I need to update app.py to return full config for editing.

            // Assuming app.py is updated to return config details in a separate endpoint or list.
            // Let's assume I'll fix app.py to return full details in GET /programs or a new GET /programs/<name>

            // Quick fix: I'll implement GET /programs/<name> in app.py
            const pRes = await fetch(`/programs/${name}/config`);
            if (!pRes.ok) {
                alert("Could not fetch program details");
                return;
            }
            const p = await pRes.json();

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('modal-title').textContent = 'Edit Service';

            document.getElementById('name').value = p.name;
            document.getElementById('name').disabled = false; // Allow renaming
            document.getElementById('original-name').value = p.name;
            document.getElementById('command').value = p.command;
            document.getElementById('cwd').value = p.cwd;
            document.getElementById('autostart').checked = p.autostart;

            // Env
            const envStr = Object.entries(p.environment || {})
                .map(([k, v]) => `${k}=${v}`)
                .join('\n');
            document.getElementById('environment').value = envStr;

            isEditing = true;
        }

        form.onsubmit = async (e) => {
            e.preventDefault();

            const envDict = {};
            document.getElementById('environment').value.split('\n').forEach(line => {
                const [key, ...val] = line.split('=');
                if (key && val) envDict[key.trim()] = val.join('=').trim();
            });

            const data = {
                name: document.getElementById('name').value,
                command: document.getElementById('command').value,
                cwd: document.getElementById('cwd').value,
                autostart: document.getElementById('autostart').checked,
                environment: envDict
            };

            const url = isEditing ? `/programs/${data.name}` : '/programs';
            const method = isEditing ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert(err.error || 'Failed to save');
                } else {
                    closeModal();
                }
            } catch (err) {
                alert(err.message);
            }
        };
    </script>
    <script>
        // Terminal Logic

        function createNewTerminal() {
            terminalCount++;
            const id = `term-${Date.now()}`;
            const name = `Terminal ${terminalCount}`;

            // Create Tab
            const tab = document.createElement('button');
            tab.id = `tab-${id}`;
            tab.className = 'flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition-colors bg-gray-800 text-gray-400 hover:text-white hover:bg-gray-700';
            tab.onclick = () => switchTab(id);
            tab.innerHTML = `
                <i data-lucide="terminal-square" class="w-4 h-4"></i>
                <span>${name}</span>
                <span onclick="event.stopPropagation(); closeTerminal('${id}')" class="hover:text-red-400 p-0.5 rounded-full hover:bg-red-500/10 transition-colors">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </span>
            `;
            document.getElementById('terminal-tabs').appendChild(tab);

            // Create Container
            const container = document.createElement('div');
            container.id = `container-${id}`;
            container.className = 'absolute inset-0 hidden';
            document.getElementById('terminal-container').appendChild(container);

            // Initialize xterm
            const term = new Terminal({
                theme: {
                    background: '#000000',
                    foreground: '#f3f4f6',
                    cursor: '#ffffff',
                    selectionBackground: 'rgba(255, 255, 255, 0.3)'
                },
                fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace',
                fontSize: 14,
                cursorBlink: true
            });

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(container);

            // Store session
            terminals[id] = { term, fitAddon, container, tab };

            // Handle Input
            term.onData(data => {
                socket.emit('terminal_input', { id, data });
            });

            // Handle Resize
            // We need to wait for visibility to fit properly

            // Notify server
            socket.emit('terminal_create', { id });

            // Switch to new tab
            switchTab(id);

            lucide.createIcons();
        }

        function switchTab(id) {
            if (activeTerminalId === id) return;

            // Hide current
            if (activeTerminalId && terminals[activeTerminalId]) {
                terminals[activeTerminalId].container.classList.add('hidden');
                terminals[activeTerminalId].tab.classList.remove('bg-gray-700', 'text-white');
                terminals[activeTerminalId].tab.classList.add('bg-gray-800', 'text-gray-400');
            }

            // Show new
            activeTerminalId = id;
            const session = terminals[id];
            if (session) {
                session.container.classList.remove('hidden');
                session.tab.classList.remove('bg-gray-800', 'text-gray-400');
                session.tab.classList.add('bg-gray-700', 'text-white');

                // Fit terminal
                requestAnimationFrame(() => {
                    session.fitAddon.fit();
                    const dims = session.fitAddon.proposeDimensions();
                    if (dims) {
                        socket.emit('terminal_resize', { id, cols: dims.cols, rows: dims.rows });
                    }
                    session.term.focus();
                });
            }
        }

        function closeTerminal(id) {
            socket.emit('terminal_close', { id });
            removeTerminal(id);
        }

        function removeTerminal(id) {
            const session = terminals[id];
            if (!session) return;

            // Cleanup DOM
            session.tab.remove();
            session.container.remove();
            session.term.dispose();

            delete terminals[id];

            if (activeTerminalId === id) {
                activeTerminalId = null;
                // Switch to last available tab if any
                const keys = Object.keys(terminals);
                if (keys.length > 0) {
                    switchTab(keys[keys.length - 1]);
                }
            }
        }

        // Window Resize Handler
        window.addEventListener('resize', () => {
            if (activeTerminalId && terminals[activeTerminalId]) {
                const session = terminals[activeTerminalId];
                session.fitAddon.fit();
                const dims = session.fitAddon.proposeDimensions();
                if (dims) {
                    socket.emit('terminal_resize', { id: activeTerminalId, cols: dims.cols, rows: dims.rows });
                }
            }
        });

        // Initialize one terminal by default? Maybe not, let user choose.
    </script>
    <script>
        // File Manager Logic
        const fileModal = document.getElementById('file-modal');
        const fileList = document.getElementById('file-list');
        const currentPathDisplay = document.getElementById('current-path');
        let currentPath = '.';

        function openFileManager() {
            fileModal.classList.remove('hidden');
            fileModal.classList.add('flex');
            fetchFiles('.');
        }

        function closeFileManager() {
            fileModal.classList.add('hidden');
            fileModal.classList.remove('flex');
        }

        async function fetchFiles(path) {
            try {
                const res = await fetch(`/api/files?path=${encodeURIComponent(path)}`);
                if (!res.ok) throw new Error('Failed to load files');
                const data = await res.json();

                currentPath = data.current_path;
                currentPathDisplay.textContent = currentPath === '.' ? '/' : '/' + currentPath;

                renderFiles(data.files);
            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }

        function renderFiles(files) {
            fileList.innerHTML = '';

            if (files.length === 0) {
                fileList.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500">No files found</td></tr>';
                return;
            }

            files.forEach(file => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-900/50 transition-colors group';

                const icon = file.is_dir
                    ? '<i data-lucide="folder" class="w-4 h-4 text-blue-400 fill-blue-400/20"></i>'
                    : '<i data-lucide="file" class="w-4 h-4 text-gray-400"></i>';

                const size = file.is_dir ? '-' : formatBytes(file.size);
                const date = new Date(file.modified * 1000).toLocaleString();

                const nameClass = file.is_dir ? 'text-blue-400 hover:underline cursor-pointer font-medium' : 'text-gray-200';
                const clickHandler = file.is_dir ? `onclick="fetchFiles('${currentPath}/${file.name}')"` : '';

                tr.innerHTML = `
                    <td class="p-3 flex items-center gap-3">
                        ${icon}
                        <span class="${nameClass}" ${clickHandler}>${file.name}</span>
                    </td>
                    <td class="p-3 text-gray-400 font-mono text-xs">${size}</td>
                    <td class="p-3 text-gray-500 text-xs">${date}</td>
                    <td class="p-3 text-right opacity-0 group-hover:opacity-100 transition-opacity">
                        ${!file.is_dir ? `
                            <button onclick="downloadFile('${file.name}')" class="p-1 hover:bg-gray-800 rounded text-blue-400" title="Download">
                                <i data-lucide="download" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                    </td>
                `;
                fileList.appendChild(tr);
            });
            lucide.createIcons();
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        async function handleFileUpload(input) {
            if (!input.files || input.files.length === 0) return;

            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('path', currentPath);

            try {
                // Show uploading state?
                const res = await fetch('/api/files/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Upload failed');
                }

                // Refresh list
                fetchFiles(currentPath);

            } catch (err) {
                alert(err.message);
            } finally {
                input.value = ''; // Reset
            }
        }

        function downloadFile(name) {
            const path = currentPath === '.' ? name : `${currentPath}/${name}`;
            window.open(`/api/files/download?path=${encodeURIComponent(path)}`, '_blank');
        }
    </script>
