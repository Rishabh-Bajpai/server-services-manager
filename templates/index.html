<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Services Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #16161f;
            --border-subtle: #1e1e2a;
            --border-active: #2d2d3a;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-purple: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --glow-blue: rgba(59, 130, 246, 0.15);
            --glow-green: rgba(16, 185, 129, 0.15);
            --glow-red: rgba(239, 68, 68, 0.15);
        }

        * {
            font-family: 'Space Grotesk', system-ui, sans-serif;
        }

        code, .font-mono, .terminal-container {
            font-family: 'JetBrains Mono', ui-monospace, monospace !important;
        }

        body {
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at top left, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(139, 92, 246, 0.03) 0%, transparent 50%);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a4a;
        }

        .terminal-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .terminal-scroll::-webkit-scrollbar-track {
            background: #0d0d12;
        }

        .terminal-scroll::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }

        .terminal-scroll::-webkit-scrollbar-thumb:hover {
            background: #3a3a4a;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
            50% { box-shadow: 0 0 20px 4px rgba(59, 130, 246, 0.1); }
        }

        @keyframes status-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .animate-slide-up {
            animation: slideUp 0.4s ease-out forwards;
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -8px rgba(0, 0, 0, 0.4);
            border-color: var(--border-active);
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px -4px currentColor;
        }

        .status-running {
            animation: status-pulse 2s ease-in-out infinite;
        }

        .glass-effect {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .gradient-border {
            position: relative;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(139, 92, 246, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .log-line {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>

<body class="bg-[var(--bg-primary)] text-[var(--text-primary)] h-screen overflow-hidden">
    <div id="app" class="flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="flex-none px-4 sm:px-6 py-3 sm:py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[var(--border-subtle)] glass-effect z-10">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Server Services Manager</h1>
                    <p class="text-[var(--text-muted)] text-xs font-medium hidden sm:block">Control Center</p>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-wrap justify-end">
                <a href="/monitor"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-[var(--accent-green)]/10 text-[var(--accent-green)] border border-[var(--accent-green)]/20 rounded-lg hover:bg-[var(--accent-green)]/20 transition-all text-sm font-medium">
                    <i data-lucide="activity" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Monitor</span>
                </a>
                <a href="/control"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-[var(--accent-orange)]/10 text-[var(--accent-orange)] border border-[var(--accent-orange)]/20 rounded-lg hover:bg-[var(--accent-orange)]/20 transition-all text-sm font-medium">
                    <i data-lucide="gamepad-2" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Control</span>
                </a>
                <button onclick="openFileManager()"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-white/5 text-[var(--text-secondary)] border border-[var(--border-subtle)] rounded-lg hover:bg-white/10 transition-all text-sm font-medium">
                    <i data-lucide="folder" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Files</span>
                </button>
                <button onclick="openModal()"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg hover:from-blue-600 hover:to-blue-700 transition-all text-sm font-medium shadow-lg shadow-blue-500/25">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Add Service</span>
                </button>
                <a href="/logout"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-[var(--accent-red)]/10 text-[var(--accent-red)] border border-[var(--accent-red)]/20 rounded-lg hover:bg-[var(--accent-red)]/20 transition-all text-sm font-medium">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Logout</span>
                </a>
                <div id="connection-status"
                    class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-[var(--accent-red)]/10 text-[var(--accent-red)] border border-[var(--accent-red)]/20">
                    <span class="w-2 h-2 rounded-full bg-current status-running"></span>
                </div>
            </div>
        </header>

        <!-- Main Content (Split View) -->
        <div class="flex-1 flex flex-col min-h-0 relative">

            <!-- Services Pane (Top) -->
            <div id="services-pane" class="flex-1 overflow-y-auto min-h-[250px] p-3 sm:p-6 flex flex-col">
                <main id="program-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                    <!-- Programs will be injected here -->
                </main>
            </div>

            <!-- Resizer Handle -->
            <div id="resizer"
                class="h-3 bg-[var(--bg-secondary)] border-y border-[var(--border-subtle)] cursor-row-resize hover:bg-[var(--accent-blue)]/10 hover:border-[var(--accent-blue)]/30 transition-all flex items-center justify-center shrink-0 z-20 group">
                <div class="w-12 h-1 rounded-full bg-[var(--border-active)] group-hover:bg-[var(--accent-blue)]/50 transition-colors"></div>
            </div>

            <!-- Terminal Pane (Bottom) -->
            <div id="terminal-pane" class="h-[280px] min-h-[150px] bg-[var(--bg-primary)] flex flex-col p-3 sm:p-6 pt-2">
                <section class="flex-1 bg-[var(--bg-card)] rounded-2xl border border-[var(--border-subtle)] overflow-hidden flex flex-col shadow-xl">
                    <div class="flex items-center justify-between border-b border-[var(--border-subtle)] px-3 py-2 shrink-0 bg-[var(--bg-secondary)]">
                        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar" id="terminal-tabs">
                            <!-- Tabs injected here -->
                        </div>
                        <button onclick="createNewTerminal()"
                            class="p-2 hover:bg-white/5 rounded-lg text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-all"
                            title="New Terminal">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div id="terminal-container" class="flex-1 bg-[#0a0a0f] relative">
                        <!-- Terminals injected here -->
                    </div>
                </section>
            </div>

        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 animate-fade-in">
        <div class="bg-[var(--bg-card)] text-[var(--text-primary)] rounded-2xl border border-[var(--border-subtle)] shadow-2xl w-full max-w-md p-6 relative animate-slide-up gradient-border">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-lg bg-white/5 text-[var(--text-muted)] hover:bg-white/10 hover:text-[var(--text-primary)] transition-all">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <h2 id="modal-title" class="text-xl font-bold mb-6 bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Add New Service</h2>

            <form id="service-form" class="space-y-4">
                <input type="hidden" id="original-name">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-[var(--text-secondary)]">Name</label>
                    <input type="text" id="name" required
                        class="w-full bg-[var(--bg-secondary)] rounded-xl border border-[var(--border-subtle)] px-4 py-2.5 text-sm focus:border-[var(--accent-blue)] focus:ring-2 focus:ring-[var(--accent-blue)]/20 focus:outline-none transition-all placeholder:text-[var(--text-muted)]">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-[var(--text-secondary)]">Command</label>
                    <input type="text" id="command" required placeholder="e.g. python main.py"
                        class="w-full bg-[var(--bg-secondary)] rounded-xl border border-[var(--border-subtle)] px-4 py-2.5 text-sm font-mono focus:border-[var(--accent-blue)] focus:ring-2 focus:ring-[var(--accent-blue)]/20 focus:outline-none transition-all placeholder:text-[var(--text-muted)]">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-[var(--text-secondary)]">Working Directory</label>
                    <input type="text" id="cwd" required placeholder="/path/to/dir"
                        class="w-full bg-[var(--bg-secondary)] rounded-xl border border-[var(--border-subtle)] px-4 py-2.5 text-sm font-mono focus:border-[var(--accent-blue)] focus:ring-2 focus:ring-[var(--accent-blue)]/20 focus:outline-none transition-all placeholder:text-[var(--text-muted)]">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-[var(--text-secondary)]">Environment Variables</label>
                    <textarea id="environment" placeholder="KEY=VALUE (one per line)"
                        class="w-full bg-[var(--bg-secondary)] rounded-xl border border-[var(--border-subtle)] px-4 py-2.5 text-sm font-mono h-24 focus:border-[var(--accent-blue)] focus:ring-2 focus:ring-[var(--accent-blue)]/20 focus:outline-none transition-all placeholder:text-[var(--text-muted)]"></textarea>
                </div>
                <div class="flex items-center gap-3 py-2">
                    <div class="relative">
                        <input type="checkbox" id="autostart" checked
                            class="sr-only peer">
                        <label for="autostart" class="w-10 h-5 bg-[var(--bg-secondary)] rounded-full cursor-pointer peer-checked:bg-[var(--accent-blue)] transition-colors border border-[var(--border-subtle)] peer-checked:border-[var(--accent-blue)]">
                            <span class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></span>
                        </label>
                    </div>
                    <label for="autostart" class="text-sm text-[var(--text-secondary)]">Auto-start on launch</label>
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3 rounded-xl font-semibold hover:from-blue-600 hover:to-blue-700 transition-all shadow-lg shadow-blue-500/25 btn-glow mt-6">
                    Save Service
                </button>
            </form>
        </div>
    </div>

    <!-- File Manager Modal -->
    <div id="file-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div
            class="bg-[var(--bg-card)] text-[var(--text-primary)] rounded-2xl border border-[var(--border-subtle)] shadow-2xl w-full max-w-4xl h-[80vh] flex flex-col relative animate-slide-up gradient-border">
            <button onclick="closeFileManager()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-lg bg-white/5 text-[var(--text-muted)] hover:bg-white/10 hover:text-[var(--text-primary)] transition-all z-10">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <div class="p-6 border-b border-[var(--border-subtle)] flex items-center justify-between">
                <h2 class="text-xl font-bold flex items-center gap-3 bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <i data-lucide="folder-open" class="w-5 h-5 text-white"></i>
                    </div>
                    File Manager
                </h2>
                <div class="mr-8">
                    <span id="current-path" class="text-[var(--text-muted)] font-mono text-sm bg-[var(--bg-secondary)] px-3 py-1.5 rounded-lg border border-[var(--border-subtle)]">/</span>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="px-4 py-3 bg-[var(--bg-secondary)] border-b border-[var(--border-subtle)] flex items-center gap-3">
                <button onclick="fetchFiles(currentPath + '/..')"
                    class="p-2.5 bg-white/5 hover:bg-white/10 rounded-lg transition-all text-[var(--text-secondary)] hover:text-[var(--text-primary)] border border-[var(--border-subtle)]" title="Go Up">
                    <i data-lucide="arrow-up" class="w-4 h-4"></i>
                </button>
                <button onclick="fetchFiles(currentPath)"
                    class="p-2.5 bg-white/5 hover:bg-white/10 rounded-lg transition-all text-[var(--text-secondary)] hover:text-[var(--text-primary)] border border-[var(--border-subtle)]" title="Refresh">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
                <div class="w-px h-8 bg-[var(--border-subtle)]"></div>

                <input type="file" id="file-upload-input" class="hidden" onchange="handleFileUpload(this)">
                <label for="file-upload-input"
                    class="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg cursor-pointer hover:from-blue-600 hover:to-blue-700 transition-all text-sm font-semibold shadow-lg shadow-blue-500/25">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    Upload File
                </label>
            </div>

            <!-- File List -->
            <div class="flex-1 overflow-y-auto p-4">
                <table class="w-full text-left text-sm">
                    <thead class="sticky top-0">
                        <tr class="bg-[var(--bg-secondary)]">
                            <th class="p-3 font-semibold text-[var(--text-muted)] uppercase tracking-wider text-xs">Name</th>
                            <th class="p-3 font-semibold text-[var(--text-muted)] uppercase tracking-wider text-xs w-32">Size</th>
                            <th class="p-3 font-semibold text-[var(--text-muted)] uppercase tracking-wider text-xs w-48">Modified</th>
                            <th class="p-3 font-semibold text-[var(--text-muted)] uppercase tracking-wider text-xs w-24 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="file-list" class="divide-y divide-[var(--border-subtle)]">
                        <!-- Files injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Resizing Logic
        const resizer = document.getElementById('resizer');
        const servicesPane = document.getElementById('services-pane');
        const terminalPane = document.getElementById('terminal-pane');
        const appContainer = document.querySelector('.flex-1.flex-col.min-h-0'); // The main container

        let isResizing = false;

        if (resizer) {
            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'row-resize';
                resizer.classList.add('bg-blue-600/20');
                e.preventDefault(); // Prevent text selection
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                // Calculate new height for terminal pane from bottom
                const containerRect = appContainer.getBoundingClientRect();
                const newTerminalHeight = containerRect.bottom - e.clientY;

                // Constraints
                const MIN_TERMINAL_HEIGHT = 150;
                const MAX_TERMINAL_HEIGHT = containerRect.height - 150; // Keep space for services

                if (newTerminalHeight >= MIN_TERMINAL_HEIGHT && newTerminalHeight <= MAX_TERMINAL_HEIGHT) {
                    terminalPane.style.height = `${newTerminalHeight}px`;
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    resizer.classList.remove('bg-blue-600/20');

                    // Trigger resize for terminals to refit
                    if (typeof activeTerminalId !== 'undefined' && activeTerminalId && terminals[activeTerminalId]) {
                        const session = terminals[activeTerminalId];
                        session.fitAddon.fit();
                        const dims = session.fitAddon.proposeDimensions();
                        if (dims) {
                            socket.emit('terminal_resize', { id: activeTerminalId, cols: dims.cols, rows: dims.rows });
                        }
                    }
                }
            });
        }
    </script>
    <script>
        const socket = io({
            transports: ['websocket'],
            upgrade: false
        });
        const grid = document.getElementById('program-grid');
        const connectionStatus = document.getElementById('connection-status');
        let programsState = {}; // Store local state like auto-scroll per program

        // Terminal State
        let terminals = {}; // { id: { term: Terminal, fitAddon: FitAddon, container: HTMLElement } }
        let activeTerminalId = null;
        let terminalCount = 0;

        // Icons initialization
        lucide.createIcons();

        socket.on('connect', () => {
            connectionStatus.textContent = 'System Online';
            connectionStatus.className = 'px-3 py-1 rounded-full text-xs font-medium bg-green-500/10 text-green-500';
        });

        socket.on('disconnect', () => {
            connectionStatus.textContent = 'Disconnected';
            connectionStatus.className = 'px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-500';
        });

        socket.on('update', (msg) => {
            renderPrograms(msg.data);
        });

        // Terminal Socket Events
        socket.on('terminal_output', (msg) => {
            const session = terminals[msg.id];
            if (session) {
                session.term.write(msg.data);
            }
        });

        socket.on('terminal_closed', (msg) => {
            removeTerminal(msg.id);
        });

        function renderPrograms(programs) {
            if (programs.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center pt-20 animate-fade-in">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500/20 to-purple-500/20 flex items-center justify-center mb-3 border border-[var(--border-subtle)]">
                            <i data-lucide="server" class="w-7 h-7 text-[var(--accent-blue)]"></i>
                        </div>
                        <h3 class="text-base font-semibold text-[var(--text-primary)] mb-1">No services yet</h3>
                        <button onclick="openModal()" class="mt-3 flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl text-sm font-semibold hover:from-blue-600 hover:to-blue-700 transition-all shadow-lg shadow-blue-500/25 btn-glow">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Add Service
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Clear empty state if present
            const emptyState = grid.querySelector('.col-span-full');
            if (emptyState) emptyState.remove();

            programs.forEach(p => {
                let card = document.getElementById(`card-${p.name}`);
                if (!card) {
                    card = createCard(p);
                    grid.appendChild(card);
                    // Initialize state
                    programsState[p.name] = { autoScroll: true, collapsed: false };
                } else {
                    updateCard(card, p);
                }
            });

            // Remove deleted
            const currentNames = programs.map(p => p.name);
            Array.from(grid.children).forEach(child => {
                const name = child.id.replace('card-', '');
                if (!currentNames.includes(name) && child.id.startsWith('card-')) {
                    child.remove();
                }
            });

            lucide.createIcons();
        }

        function getStatusColor(status) {
            switch (status) {
                case 'running': return 'text-[var(--accent-green)] bg-[var(--accent-green)]/10 border-[var(--accent-green)]/20';
                case 'stopped': return 'text-[var(--text-muted)] bg-white/5 border-[var(--border-subtle)]';
                case 'starting': return 'text-[var(--accent-blue)] bg-[var(--accent-blue)]/10 border-[var(--accent-blue)]/20';
                case 'stopping': return 'text-[var(--accent-yellow)] bg-[var(--accent-yellow)]/10 border-[var(--accent-yellow)]/20';
                case 'failed': return 'text-[var(--accent-red)] bg-[var(--accent-red)]/10 border-[var(--accent-red)]/20';
                default: return 'text-[var(--text-muted)]';
            }
        }

        function getStatusIndicatorColor(status) {
            switch (status) {
                case 'running': return 'bg-[var(--accent-green)] shadow-[var(--glow-green)] shadow-lg status-running';
                case 'stopped': return 'bg-[var(--text-muted)]';

        function updateCard(card, p) {
            // Update Status Badge
            const badge = card.querySelector('.status-badge');
            badge.className = `status-badge px-2 py-1 rounded text-xs font-medium border uppercase tracking-wider ${getStatusColor(p.status)}`;
            badge.textContent = p.status;

            // Update Status Indicator
            const indicator = card.querySelector('.status-indicator');
            indicator.className = `status-indicator w-2 h-2 rounded-full ${p.status === 'running' ? 'bg-green-500' : 'bg-gray-500'}`;

            // Update Restarts
            const restartCount = card.querySelector('.restart-count');
            if (restartCount) restartCount.textContent = p.restart_count;

            // Update CPU & Memory
            const cpuEl = card.querySelector('.cpu-usage');
            const memEl = card.querySelector('.memory-usage');
            if (cpuEl) cpuEl.textContent = p.cpu !== null && p.cpu !== undefined ? `${p.cpu.toFixed(1)}%` : '--';
            if (memEl) memEl.textContent = p.memory !== null && p.memory !== undefined ? `${p.memory.toFixed(1)}%` : '--';

            // State
            const state = programsState[p.name];

            // Update Collapse UI
            const collapseIcon = card.querySelector('.collapse-icon');
            if (collapseIcon) collapseIcon.setAttribute('data-lucide', state.collapsed ? 'chevron-right' : 'chevron-down');

            card.style.minHeight = state.collapsed ? 'auto' : '380px';

            const terminal = card.querySelector('.terminal-container');
            const resourceBar = card.querySelector('.resource-bar');
            const footer = card.querySelector('.p-4.border-t');

            if (state.collapsed) {
                terminal.classList.add('hidden');
                if (resourceBar) resourceBar.classList.add('hidden');
                footer.classList.add('hidden');
            } else {
                terminal.classList.remove('hidden');
                if (resourceBar) resourceBar.classList.remove('hidden');
                footer.classList.remove('hidden');

                // Update Logs only if visible
                const logsContainer = card.querySelector('.logs');
                logsContainer.textContent = p.logs.join('\n');

                // Auto-scroll
                if (state.autoScroll) {
                    terminal.scrollTop = terminal.scrollHeight;
                }

                // Update Auto-scroll icon
                const lockIcon = card.querySelector('.autoscroll-icon');
                if (lockIcon) lockIcon.setAttribute('data-lucide', state.autoScroll ? 'lock' : 'unlock');
            }

            // Button Logic
            const btnStart = card.querySelector('.btn-start');
            const btnStop = card.querySelector('.btn-stop');
            const btnRestart = card.querySelector('.btn-restart');
            const btnEdit = card.querySelector('.btn-edit');
            const btnDelete = card.querySelector('.btn-delete');

            const isRunning = p.status === 'running' || p.status === 'starting';
            const isStopped = p.status === 'stopped' || p.status === 'failed';

            if (btnStart) btnStart.disabled = isRunning;
            if (btnStop) btnStop.disabled = isStopped;
            if (btnRestart) btnRestart.disabled = isStopped; // As requested
            if (btnEdit) btnEdit.disabled = !isStopped;
            if (btnDelete) btnDelete.disabled = !isStopped;
        }

        function toggleCollapse(name) {
            if (programsState[name]) {
                programsState[name].collapsed = !programsState[name].collapsed;
                // Trigger re-render or just update class? 
                // Since we rely on updateCard for state, we can wait for next update or force one.
                // Let's force update by finding card and calling updateCard with current data?
                // We don't have current data easily. 
                // But updateCard is called every second. 
                // For immediate feedback, let's manually toggle classes.
                const card = document.getElementById(`card-${name}`);
                if (card) {
                    // We need the program object to call updateCard properly, or we just hack it.
                    // Better to wait for next tick? 1s is long.
                    // Let's just toggle classes manually here to match updateCard logic.
                    const state = programsState[name];
                    const collapseIcon = card.querySelector('.collapse-icon');
                    const terminalWrapper = card.querySelector('.terminal-wrapper');
                    const terminal = card.querySelector('.terminal-container');
                    const resourceBar = card.querySelector('.resource-bar');
                    const footer = card.querySelector('.p-4.border-t');

                    card.style.minHeight = state.collapsed ? 'auto' : '380px';
                    if (collapseIcon) {
                        collapseIcon.setAttribute('data-lucide', state.collapsed ? 'chevron-right' : 'chevron-down');
                        lucide.createIcons();
                    }

                    if (state.collapsed) {
                        if (terminalWrapper) terminalWrapper.classList.add('hidden');
                        if (resourceBar) resourceBar.classList.add('hidden');
                        footer.classList.add('hidden');
                    } else {
                        if (terminalWrapper) terminalWrapper.classList.remove('hidden');
                        if (resourceBar) resourceBar.classList.remove('hidden');
                        footer.classList.remove('hidden');
                        // Scroll to bottom if auto-scroll
                        if (state.autoScroll) terminal.scrollTop = terminal.scrollHeight;
                    }
                }
            }
        }

        function toggleAutoScroll(name) {
            if (programsState[name]) {
                programsState[name].autoScroll = !programsState[name].autoScroll;
                // Immediate feedback
                const card = document.getElementById(`card-${name}`);
                const lockIcon = card.querySelector('.autoscroll-icon');
                if (lockIcon) {
                    lockIcon.setAttribute('data-lucide', programsState[name].autoScroll ? 'lock' : 'unlock');
                    lucide.createIcons();
                }
            }
        }

            // Wait, the GET /programs in app.py returns status/restart_count too, but maybe not config details?
            // Let's check app.py... it returns name, status... 
            // I need to update app.py to return full config for editing.

            // Assuming app.py is updated to return config details in a separate endpoint or list.
            // Let's assume I'll fix app.py to return full details in GET /programs or a new GET /programs/<name>

            // Quick fix: I'll implement GET /programs/<name> in app.py

        form.onsubmit = async (e) => {
            e.preventDefault();

            const envDict = {};

                const [key, ...val] = line.split('=');
                if (key && val) envDict[key.trim()] = val.join('=').trim();
            });

            const data = {
                name: document.getElementById('name').value,
                command: document.getElementById('command').value,
                cwd: document.getElementById('cwd').value,
                autostart: document.getElementById('autostart').checked,
                environment: envDict
            };

            const originalName = document.getElementById('original-name').value;
            const url = isEditing ? `/programs/${originalName || data.name}` : '/programs';
            const method = isEditing ? 'PUT' : 'POST';

            try {

    <script>
        // Terminal Logic

        function createNewTerminal() {
            terminalCount++;
            const id = `term-${Date.now()}`;
            const name = `Terminal ${terminalCount}`;

            // Create Tab
            const tab = document.createElement('button');
            tab.id = `tab-${id}`;
            tab.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium transition-all bg-white/5 text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-white/10 border border-transparent hover:border-[var(--border-subtle)]';
            tab.onclick = () => switchTab(id);
            tab.innerHTML = `
                <div class="w-5 h-5 rounded-md bg-[var(--accent-purple)]/20 flex items-center justify-center">
                    <i data-lucide="terminal" class="w-3 h-3 text-[var(--accent-purple)]"></i>
                </div>
                <span>${name}</span>
                <span onclick="event.stopPropagation(); closeTerminal('${id}')" class="ml-1 p-0.5 rounded-md hover:text-[var(--accent-red)] hover:bg-[var(--accent-red)]/10 transition-all">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </span>
            `;
            document.getElementById('terminal-tabs').appendChild(tab);

            // Create Container
            const container = document.createElement('div');
            container.id = `container-${id}`;
            container.className = 'absolute inset-0 hidden';
            document.getElementById('terminal-container').appendChild(container);

            // Initialize xterm
            const term = new Terminal({
                theme: {
                    background: '#0a0a0f',
                    foreground: '#f1f5f9',
                    cursor: '#3b82f6',
                    selectionBackground: 'rgba(59, 130, 246, 0.3)',
                    cursorAccent: '#0a0a0f'
                },
                fontFamily: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                fontSize: 13,
                lineHeight: 1.5,
                cursorBlink: true,
                cursorStyle: 'bar'
            });

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(container);

            // Store session
            terminals[id] = { term, fitAddon, container, tab };

            // Handle Input
            term.onData(data => {
                socket.emit('terminal_input', { id, data });
            });

            // Handle Resize
            // We need to wait for visibility to fit properly

            // Notify server
            socket.emit('terminal_create', { id });

            // Switch to new tab
            switchTab(id);

            lucide.createIcons();
        }

        function switchTab(id) {
            if (activeTerminalId === id) return;

            // Hide current
            if (activeTerminalId && terminals[activeTerminalId]) {
                terminals[activeTerminalId].container.classList.add('hidden');
                terminals[activeTerminalId].tab.classList.remove('bg-[var(--accent-blue)]/10', 'text-[var(--accent-blue)]', 'border-[var(--accent-blue)]/30');
                terminals[activeTerminalId].tab.classList.add('bg-white/5', 'text-[var(--text-muted)]', 'border-transparent');
            }

            // Show new
            activeTerminalId = id;
            const session = terminals[id];
            if (session) {
                session.container.classList.remove('hidden');
                session.tab.classList.remove('bg-white/5', 'text-[var(--text-muted)]', 'border-transparent');
                session.tab.classList.add('bg-[var(--accent-blue)]/10', 'text-[var(--accent-blue)]', 'border-[var(--accent-blue)]/30');

                // Fit terminal
                requestAnimationFrame(() => {
                    session.fitAddon.fit();
                    const dims = session.fitAddon.proposeDimensions();
                    if (dims) {
                        socket.emit('terminal_resize', { id, cols: dims.cols, rows: dims.rows });
                    }
                    session.term.focus();
                });
            }
        }

        function closeTerminal(id) {
            socket.emit('terminal_close', { id });
            removeTerminal(id);
        }

        function removeTerminal(id) {
            const session = terminals[id];
            if (!session) return;

            // Cleanup DOM
            session.tab.remove();
            session.container.remove();
            session.term.dispose();

            delete terminals[id];

            if (activeTerminalId === id) {
                activeTerminalId = null;
                // Switch to last available tab if any
                const keys = Object.keys(terminals);
                if (keys.length > 0) {
                    switchTab(keys[keys.length - 1]);
                }
            }
        }

        // Window Resize Handler
        window.addEventListener('resize', () => {
            if (activeTerminalId && terminals[activeTerminalId]) {
                const session = terminals[activeTerminalId];
                session.fitAddon.fit();
                const dims = session.fitAddon.proposeDimensions();
                if (dims) {
                    socket.emit('terminal_resize', { id: activeTerminalId, cols: dims.cols, rows: dims.rows });
                }
            }
        });

        // Initialize one terminal by default? Maybe not, let user choose.
    </script>
    <script>
        // File Manager Logic
        const fileModal = document.getElementById('file-modal');
        const fileList = document.getElementById('file-list');
        const currentPathDisplay = document.getElementById('current-path');

        function openFileManager() {
            fileModal.classList.remove('hidden');

            fetchFiles('.');

        function closeFileManager() {
            fileModal.classList.add('hidden');

        async function fetchFiles(path) {
            try {
                const res = await fetch(`/api/files?path=${encodeURIComponent(path)}`);
                if (!res.ok) throw new Error('Failed to load files');
                const data = await res.json();

                currentPath = data.current_path;
                currentPathDisplay.textContent = currentPath === '.' ? '/' : '/' + currentPath;

                renderFiles(data.files);
            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }

        function renderFiles(files) {
            fileList.innerHTML = '';

            if (files.length === 0) {
                fileList.innerHTML = `
                    <tr>
                        <td colspan="4" class="p-12 text-center">
                            <div class="flex flex-col items-center">
                                <div class="w-16 h-16 rounded-2xl bg-[var(--bg-secondary)] flex items-center justify-center mb-4 border border-[var(--border-subtle)]">

                            </div>

                `;
                lucide.createIcons();
                return;

            files.forEach(file => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-white/5 transition-all group cursor-pointer';

                const icon = file.is_dir
                    ? '<div class="w-8 h-8 rounded-lg bg-[var(--accent-blue)]/10 flex items-center justify-center"><i data-lucide="folder" class="w-4 h-4 text-[var(--accent-blue)]"></i></div>'
                    : '<div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center"><i data-lucide="file" class="w-4 h-4 text-[var(--text-muted)]"></i></div>';

                const size = file.is_dir ? '-' : formatBytes(file.size);
                const date = new Date(file.modified * 1000).toLocaleString();

                const nameClass = file.is_dir ? 'text-[var(--accent-blue)] hover:underline cursor-pointer font-medium' : 'text-[var(--text-primary)]';
                const clickHandler = file.is_dir ? `onclick="fetchFiles('${currentPath}/${file.name}')"` : '';

                tr.innerHTML = `
                    <td class="p-3 flex items-center gap-3">
                        ${icon}
                        <span class="${nameClass}" ${clickHandler}>${file.name}</span>
                    </td>
                    <td class="p-3 text-[var(--text-muted)] font-mono text-xs">${size}</td>
                    <td class="p-3 text-[var(--text-muted)] text-xs">${date}</td>
                    <td class="p-3 text-right opacity-0 group-hover:opacity-100 transition-opacity">
                        ${!file.is_dir ? `
                            <button onclick="downloadFile('${file.name}')" class="p-2 hover:bg-white/10 rounded-lg text-[var(--accent-blue)] transition-all" title="Download">
                                <i data-lucide="download" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                    </td>
                `;
                fileList.appendChild(tr);
            });
            lucide.createIcons();
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        async function handleFileUpload(input) {
            if (!input.files || input.files.length === 0) return;

            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('path', currentPath);

            try {
                // Show uploading state?
                const res = await fetch('/api/files/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Upload failed');
                }

                // Refresh list
                fetchFiles(currentPath);

            } catch (err) {
                alert(err.message);
            } finally {
                input.value = ''; // Reset
            }
        }

        function downloadFile(name) {
            const path = currentPath === '.' ? name : `${currentPath}/${name}`;
            window.open(`/api/files/download?path=${encodeURIComponent(path)}`, '_blank');
        }
    </script>
</body>

</html>
