<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="sans-serif">
  <rect x="0" y="0" width="1200" height="600" rx="16" fill="#16161F"/>
  <rect x="1" y="1" width="1198" height="598" rx="15" fill="none" stroke="#2A2A3A" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">Server Services Manager</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#9CA3AF">One dark console for your whole Linux box — services, host, data, and a full IDE</text>

  <g font-size="14" font-weight="bold">
    <rect x="30" y="112" width="262" height="34" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981"/>
    <text x="161" y="134" text-anchor="middle" fill="#10B981">RUN</text>
    <rect x="316" y="112" width="262" height="34" rx="8" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6"/>
    <text x="447" y="134" text-anchor="middle" fill="#3B82F6">OBSERVE</text>
    <rect x="602" y="112" width="262" height="34" rx="8" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6"/>
    <text x="733" y="134" text-anchor="middle" fill="#8B5CF6">MANAGE</text>
    <rect x="888" y="112" width="262" height="34" rx="8" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4"/>
    <text x="1019" y="134" text-anchor="middle" fill="#06B6D4">DEVELOP</text>
  </g>

  <g font-size="13" fill="#E5E7EB">
    <g>
      <rect x="30" y="156" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="44" y="177">Services + auto-restart</text>
      <rect x="30" y="196" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="44" y="217">Systemd timers + limits</text>
      <rect x="30" y="236" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="44" y="257">Health checks (http/tcp/cmd)</text>
      <rect x="30" y="276" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="44" y="297">ntfy / webhook / Telegram</text>
      <rect x="30" y="316" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="44" y="337">Activity log + CSV export</text>
      <rect x="30" y="356" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="44" y="377">Plugins + open API</text>
      <rect x="30" y="396" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="44" y="417">Autostart on boot</text>
    </g>
    <g>
      <rect x="316" y="156" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="330" y="177">Live CPU / mem / net charts</text>
      <rect x="316" y="196" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="330" y="217">journalctl live streaming</text>
      <rect x="316" y="236" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="330" y="257">Log search + top processes</text>
      <rect x="316" y="276" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="330" y="297">Alert delivery log</text>
      <rect x="316" y="316" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="330" y="337">Disk treemap analyzer</text>
      <rect x="316" y="356" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="330" y="377">Dependencies graph</text>
    </g>
    <g>
      <rect x="602" y="156" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="616" y="177">Any systemd unit</text>
      <rect x="602" y="196" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="616" y="217">Docker containers</text>
      <rect x="602" y="236" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="616" y="257">Cron + firewall + packages</text>
      <rect x="602" y="276" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="616" y="297">Backups with retention</text>
      <rect x="602" y="316" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="616" y="337">SSH keys + cluster peers</text>
      <rect x="602" y="356" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="616" y="377">Control panel + palette</text>
    </g>
    <g>
      <rect x="888" y="156" width="262" height="40" rx="7" fill="#06B6D4" fill-opacity="0.18" stroke="#06B6D4"/>
      <text x="902" y="174" font-weight="bold" fill="#FFFFFF">VS Code Server in-app</text>
      <text x="902" y="189" font-size="11" fill="#9CA3AF">Office docs, LAN-ready</text>
      <rect x="888" y="204" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="902" y="225">File explorer + previews</text>
      <rect x="888" y="244" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="902" y="265">Resumable uploads</text>
      <rect x="888" y="284" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="902" y="305">Multi-tab PTY terminal</text>
      <rect x="888" y="324" width="262" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="902" y="345">Config UI, secrets redacted</text>
    </g>
  </g>

  <text x="600" y="480" text-anchor="middle" font-size="14" fill="#9CA3AF">Flask + WebSockets/SSE backend  •  no build step, no framework  •  phone-to-desktop responsive</text>
  <text x="600" y="512" text-anchor="middle" font-size="14" fill="#9CA3AF">Unprivileged by design — your login password unlocks single sudo actions via sudo -S</text>
  <text x="600" y="560" text-anchor="middle" font-size="13" fill="#6B7280">MIT • Python 3.10+ • 886 tests • docs: README + /docs (Swagger)</text>
</svg>
